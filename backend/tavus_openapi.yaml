                  document_ids:
                    type: array
                    description: "Array of document IDs that the PAL has access to. These documents will be available to the PAL in all their conversations. The document_ids are returned in the response of the [Get Document](/api-reference/documents/get-document) and the [Create Document](/api-reference/documents/create-document) endpoints."
                    items:
                      type: string
                    example: ["d1234567890", "d2468101214"]
                  document_tags:
                    type: array
                    description: "Array of document tags that the PAL has access to. Documents matching these tags will be available to the PAL in all their conversations."
                    items:
                      type: string
