            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Invalid access token"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Pronunciation dictionary not found"
      security:
        - apiKey: []

    patch:
      tags:
        - Pronunciation Dictionaries
      summary: Update Pronunciation Dictionary
      description: |
        Update a pronunciation dictionary's name or rules using [JSON Patch](https://jsonpatch.com/) format (RFC 6902). Supported mutable fields are `name` and `rules`.
      operationId: patchPronunciationDictionary
      parameters:
        - in: path
          name: dictionary_id
          required: true
          schema:
            type: string
          description: "The unique identifier of the pronunciation dictionary."
          example: "pd_abc123def456gh"
      requestBody:
        description: |
          Read-only fields like `pronunciation_dictionary_id`, `created_at`, and `updated_at` are silently ignored. If all operations target read-only fields or result in no changes, the endpoint returns `304`.

          When rules are updated, all PALs referencing this dictionary are automatically updated with the new provider-specific pronunciation data.

          **Note:** Updating rules replaces the entire rules array. There is no way to add or remove individual rules - provide the complete updated list.

          For example:

          ```json
          [
            { "op": "replace", "path": "/name", "value": "Updated Brand Terms" },
            { "op": "replace", "path": "/rules", "value": [
              { "text": "Tavus", "pronunciation": "TAH-vus", "type": "alias" }
            ]}
          ]
          ```
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  op:
                    type: string
                    description: "The operation to perform. Must be one of: add, remove, replace, copy, move, test"
                    enum: ["add", "remove", "replace", "copy", "move", "test"]
                    example: "replace"
                  path:
                    type: string
                    description: "A JSON Pointer string that references a location within the target document where the operation is performed. Supported paths: `/name`, `/rules`."
                    example: "/name"
                  value:
                    description: "The value to be used within the operation. Required unless using `remove`."
                required:
                  - op
                  - path
            examples:
              Update name:
                value:
                  - op: "replace"
                    path: "/name"
                    value: "Updated Brand Terms"
              Update rules:
                value:
                  - op: "replace"
                    path: "/rules"
                    value:
                      - text: "Tavus"
                        pronunciation: "TAH-vus"
                        type: "alias"
                      - text: "CVI"
                        pronunciation: "conversational video interface"
                        type: "alias"
              Update both:
                value:
                  - op: "replace"
                    path: "/name"
                    value: "Updated Brand Terms"
                  - op: "replace"
                    path: "/rules"
                    value:
                      - text: "Tavus"
                        pronunciation: "TAH-vus"
                        type: "alias"
      responses:
        "200":
          description: "Pronunciation dictionary updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  pronunciation_dictionary_id:
                    type: string
                    description: "Unique identifier for the pronunciation dictionary."
                    example: "pd_abc123def456gh"
                  name:
                    type: string
                    description: "Name of the pronunciation dictionary."
                    example: "Updated Brand Terms"
                  rules:
                    type: array
                    description: "List of pronunciation rules."
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          example: "Tavus"
                        pronunciation:
                          type: string
                          example: "TAH-vus"
                        type:
                          type: string
                          enum: ["alias", "ipa"]
                          example: "alias"
                        case_sensitive:
                          type: boolean
                          example: false
                        word_boundaries:
                          type: boolean
                          example: true
                  rules_count:
                    type: integer
                    description: "Number of rules in the dictionary."
                    example: 1
                  created_at:
                    type: string
                    description: "ISO 8601 timestamp of when the dictionary was created."
                    example: "2025-01-15T10:30:00Z"
                  updated_at:
                    type: string
                    description: "ISO 8601 timestamp of when the dictionary was last updated."
                    example: "2025-01-15T12:00:00Z"
        "304":
          description: "No changes were made to the pronunciation dictionary"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "The error message"
                    example: "Invalid request: duplicate text values in rules"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Invalid access token"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Pronunciation dictionary not found"
        "422":
          description: "Invalid JSON patch format"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Invalid JSON patch format"
      security:
        - apiKey: []

    delete:
      tags:
        - Pronunciation Dictionaries
      summary: Delete Pronunciation Dictionary
      description: |
        Permanently delete a pronunciation dictionary and remove it from all linked PALs.
      operationId: deletePronunciationDictionary
      parameters:
        - in: path
          name: dictionary_id
          required: true
          schema:
            type: string
          description: |
            The unique identifier of the pronunciation dictionary to delete.

            **Warning:** This action is permanent. The dictionary is deleted from both Cartesia and ElevenLabs, and all PALs referencing it will have their `pronunciation_dictionary_id` set to `null` and provider-specific pronunciation settings removed from `voice_settings`.
          example: "pd_abc123def456gh"
      responses:
        "204":
          description: "NO CONTENT - Pronunciation dictionary deleted successfully"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Invalid access token"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Pronunciation dictionary not found"
      security:
        - apiKey: []

  /v2/transcriptions/{transcription_id}:
    get:
      tags:
        - Transcriptions
      summary: Get Transcription
      description: |
        This endpoint returns a single transcription by its unique identifier.
      operationId: getTranscription
      parameters:
        - in: path
          name: transcription_id
          required: true
          schema:
            type: string
          description: "A unique identifier for the transcription."
      responses:
        "200":
          description: ""
          content:
            application/json:
