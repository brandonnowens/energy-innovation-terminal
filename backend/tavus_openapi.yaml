          required: false
          description: |
            Only relevant when the PAL has unapplied changes in PAL Maker, which makes a normal patch return `409` with `"conflict": "maker_changes"`. Pass `force=true` to update the live PAL anyway and discard those Maker changes. The response then includes `discarded_maker_changes: true`.
          schema:
            type: boolean
          example: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  op:
                    type: string
                    description: "The operation to perform. Must be one of: add, remove, replace, copy, move, test"
                    enum: ["add", "remove", "replace", "copy", "move", "test"]
                    example: "add"
                  path:
                    type: string
                    description: |
                      JSON Pointer (RFC 6901) to a location in the PAL document. Paths must match the **current** document shape-compare the response from [Get PAL](/api-reference/pals/get-pal) (`GET /v2/pals/{pal_id}`) before patching.
                    example: "/layers/llm/model"
                  value:
                    type: string
                    description: "The value to be used within the operation. **This field is not required for the `remove` operation**."
                    example: "tavus-llama-4"
                required:
                  - op
                  - path
                  - value
            examples:
               Replace PAL System Prompt:
                 summary: "Replace a top-level field"
                 value:
                   - op: "replace"
                     path: "/system_prompt"
                     value: "As a Life Coach, you are a dedicated professional who specializes in..."
               Remove STT Hotwords:
                 summary: "Remove a value"
                 value:
                   - op: "remove"
                     path: "/layers/stt/hotwords"
               Update conferencing (always live):
                 summary: "layers.conferencing, sent as its own request"
                 value:
                   - op: "replace"
                     path: "/layers/conferencing/username"
                     value: "acme-anna"
               Enable EU AI Act disclosure:
                 summary: "Configure disclosure text so the PAL announces it is AI"
                 value:
                   - op: "replace"
                     path: "/disclosure_type"
                     value: "auto"
                   - op: "replace"
                     path: "/verbal_disclosure"
                     value: "Just so you know, you're speaking with an AI agent."
                   - op: "replace"
                     path: "/visual_disclosure"
                     value: "You are speaking with an AI agent."
               Set biometric emotion recognition to limited:
                 summary: "Pin emotion recognition to limited for every conversation"
                 value:
                   - op: "replace"
                     path: "/layers/perception/emotion_recognition"
                     value: "limited"
      responses:
        "200":
          description: |
            The patched live PAL body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pal_id:
                    type: string
                    description: "The id of the PAL that was updated."
                    example: "pcb7a34da5fe"
                  discarded_maker_changes:
                    type: boolean
                    description: |
                      Present and `true` only when the request passed `force=true` and pending PAL Maker changes were discarded to apply this patch. Absent otherwise.
                    example: true
        "304":
          description: "No changes were made to the PAL"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "No changes were made to the PAL"
        "400":
          description: |
            Bad Request. A common cause: a single request mixes `layers.conferencing` ops with edits to other fields — split into two requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "The error message."
                    example: "layers.conferencing must be patched separately from authored persona fields"
        "409":
          description: |
            The PAL has unapplied changes in PAL Maker. The live PAL was not changed. Retry with `?force=true` to update the live PAL and discard those Maker changes, or apply them in Maker first with **Update**.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "The error message."
                    example: "This PAL has changes in PAL Maker. Retry with force=true to update live and discard those Maker changes."
                  live_pal_id:
                    type: string
                    description: "The id of the live PAL, unchanged by this request."
                    example: "pcb7a34da5fe"
                  conflict:
                    type: string
                    enum: ["maker_changes"]
                    description: "Machine-readable conflict reason."
                    example: "maker_changes"
        "422":
          description: "Invalid JSON patch format"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid JSON patch format"
      security:
        - apiKey: []

    parameters:
      - name: pal_id
        in: path
        required: true
        description: The unique identifier of the PAL.
        schema:
          type: string
          example: pcb7a34da5fe

  /v2/tools:
    post:
      tags:
        - Tools
      summary: Create Tool
      description: |
        Create a standalone tool that can be attached to one or more PALs via [Attach Tools To PAL](/api-reference/pal-tools/attach-tools-to-pal).

        **In-call tools** (`trigger_type: in_call`, default) are invoked during the conversation by an LLM (`origin: llm`) or a perception model (`origin: vision` / `origin: audio`).

        **Post-call actions** (`trigger_type: post_call`) run once after the conversation ends; omit `origin` and set `delivery.api` (HTTPS webhook). See [Post-Call Actions](/sections/conversational-video-interface/pal/post-call-tool).

        Every tool dispatches via **exactly one** delivery channel:

        - `delivery.app_message: true` (default) - calls land on your frontend as a `conversation.tool_call` event over the Daily data channel.
        - `delivery.api` - Tavus makes an HTTPS request to a URL you configure. Supports five auth types and `{placeholder}` templating in the URL path, query string, and body.

        See [Tools Overview](/sections/conversational-video-interface/pal/tools), [LLM Tool Delivery](/sections/conversational-video-interface/pal/llm-tool-delivery), and [LLM Tool Auth](/sections/conversational-video-interface/pal/llm-tool-auth) for the conceptual model.
      operationId: createTool
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                  description: "Function name the LLM uses to call the tool. Must match OpenAI function-naming rules (letters, digits, underscores; must start with a letter or underscore; max 64 characters) and be unique within your account."
                  example: "get_weather"
                description:
                  type: string
                  description: "Natural-language description used by the LLM to decide when to call the tool. `description` plus the serialized `parameters` together must be at most 10000 characters."
                  example: "Get the current weather for a city"
                parameters:
                  type: object
                  description: "JSON Schema describing the tool's arguments. Follows the standard OpenAI function-calling shape. Property names starting with `tavus_` are reserved for Tavus-injected placeholders and are rejected."
                  default: {}
                  example:
                    type: "object"
                    properties:
                      city:
                        type: "string"
                        description: "City name"
                    required: ["city"]
                delivery:
                  $ref: "#/components/schemas/toolDelivery"
                trigger_type:
                  type: string
                  enum: ["in_call", "post_call"]
                  default: "in_call"
                  description: "When the tool runs. `in_call` (default) offers the tool during the live conversation. `post_call` runs once after the conversation ends; omit `origin` and set `delivery.api` (HTTPS webhook). See [Post-Call Actions](/sections/conversational-video-interface/pal/post-call-tool)."
                  example: "in_call"
                origin:
                  type: string
                  enum: ["llm", "vision", "audio"]
                  nullable: true
                  default: "llm"
                  description: "Live modality for in-call tools only. Required when `trigger_type` is `in_call` (defaults to `llm`). Must be omitted or null for `post_call` tools."
                  example: "llm"
                on_call:
                  type: string
                  enum: ["generate_filler", "static_filler", "silent", "passthrough"]
                  default: "generate_filler"
                  nullable: true
                  description: "What the PAL does **while** the tool call is in flight. `generate_filler` (default for `llm` tools) lets the LLM speak a contextual filler line. `static_filler` plays the `static_filler` string verbatim. `silent` says nothing. `passthrough` skips filler entirely. Must be null for perception tools."
                  example: "generate_filler"
                on_resolve:
                  type: string
                  enum: ["generate_response", "response_in_result", "add_to_context", "fire_and_forget"]
                  default: "fire_and_forget"
                  nullable: true
                  description: "what the PAL does **after** the tool returns. `generate_response` re-prompts the LLM with the result so it can answer naturally. `response_in_result` speaks the response text returned by your endpoint verbatim. `add_to_context` silently adds the result to conversation context. `fire_and_forget` ignores the result. Perception tools must use `fire_and_forget`."
                  example: "generate_response"
                static_filler:
                  type: string
                  nullable: true
                  description: "Phrase the PAL speaks while the tool call is in flight. Required when `on_call` is `static_filler`; must be null for perception tools."
                  example: "Sure, let me grab that for you."
      responses:
        "200":
          description: "Tool created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tool"
        "400":
          description: "Bad Request - validation error"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. {'delivery.api.url': 'URL must use HTTPS'}"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
        "409":
          description: "Conflict - a tool with this name already exists"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. A tool with this name already exists"
      security:
        - apiKey: []
    get:
      tags:
        - Tools
      summary: Get Tools
      description: |
        Returns a paginated list of tools. The `type` query parameter controls which tools are returned:

        - `type=user` (default) - tools you created via [Create Tool](/api-reference/tools/create-tool).
        - `type=system` - built-in system tools Tavus provides. These are always available to every conversation; you do not need to attach them. The only system tool today is `end_call`, which lets the PAL hang up at a natural stopping point.
        - `type=all` - both, with system tools listed first.

        System tools have `is_system_tool: true`, an `owner_id` of `null`, and use their `name` as the `tool_id` (e.g. `end_call`). They cannot be created, updated, or deleted.
      operationId: getTools
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: "Page size. Default 10."
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: "1-indexed page number. Default 1."
        - in: query
          name: sort
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "asc"
          description: "Sort order by `created_at`. Default `asc`."
        - in: query
          name: type
          schema:
            type: string
            enum: ["user", "system", "all"]
            default: "user"
          description: "Which tools to return."
        - in: query
          name: name_or_uuid
          schema:
            type: string
          description: "Optional filter. Case-insensitive substring match against `name`, or exact match against `tool_id`."
      responses:
        "200":
          description: "Tools returned"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/tool"
                  total_count:
                    type: integer
                    description: "Total number of tools matching the filters (across all pages)."
                    example: 12
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/tools/{tool_id}:
    parameters:
      - name: tool_id
        in: path
        required: true
        description: "The unique identifier of the tool. For system tools this is the tool's `name` (e.g. `end_call`)."
        schema:
          type: string
          example: "tabc123def456"
    get:
      tags:
        - Tools
      summary: Get Tool
      description: "Returns a single tool by its `tool_id`. Works for both user-owned tools and built-in system tools. Secret fields (`token`, `password`, `value`, `secret`, `client_secret`) are replaced with `********` in the response."
      operationId: getTool
      responses:
        "200":
          description: "Tool returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tool"
        "400":
          description: "Tool not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. Tool not found"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []
    patch:
      tags:
        - Tools
      summary: Update Tool
      description: |
        Update one or more fields on a tool. Only fields present in the body are changed; omitted fields keep their stored value. System tools cannot be updated.

        **Secrets and the `********` placeholder.** [Get Tool](/api-reference/tools/get-tool) returns secret fields scrubbed to `********`. If you do a read-modify-write and PATCH that exact value back, the request is rejected - re-encrypting the placeholder would silently corrupt the stored secret. To keep the existing secret, **omit** the field from the auth object on PATCH.

        Sending `delivery: null` resets delivery to the default `{ app_message: true }`.
      operationId: updateTool
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "New function name. Same naming and uniqueness rules as on create."
                  example: "get_current_weather"
                description:
                  type: string
                  description: "New description. Max 10000 characters (combined with `parameters`)."
                parameters:
                  type: object
                  description: "Replace the JSON Schema for the tool's arguments. Reserved `tavus_*` property names are rejected."
                delivery:
                  allOf:
                    - $ref: "#/components/schemas/toolDelivery"
                  nullable: true
                  description: "Replace the delivery config. `null` resets to the default `{ app_message: true }`."
                trigger_type:
                  type: string
                  enum: ["in_call", "post_call"]
                origin:
                  type: string
                  enum: ["llm", "vision", "audio"]
                  nullable: true
                on_call:
                  type: string
                  enum: ["generate_filler", "static_filler", "silent", "passthrough"]
                  nullable: true
                on_resolve:
                  type: string
                  enum: ["generate_response", "response_in_result", "add_to_context", "fire_and_forget"]
                  nullable: true
                static_filler:
                  type: string
                  nullable: true
            examples:
              Rename:
                value:
                  name: "get_current_weather"
              Switch to API delivery:
                value:
                  delivery:
                    app_message: false
                    api:
                      url: "https://api.example.com/weather"
                      method: "POST"
                      auth:
                        type: "bearer"
                        token: "sk_live_..."
              Change static filler:
                value:
                  on_call: "static_filler"
                  static_filler: "One moment please."
      responses:
        "200":
          description: "Tool updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tool"
        "400":
          description: "Bad Request - validation error, tool not found, or attempt to modify a system tool"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. Cannot modify system tools"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []
    delete:
      tags:
        - Tools
      summary: Delete Tool
      description: "Soft-deletes a tool and detaches it from every PAL it was attached to. The tool name is freed for reuse on a new tool. System tools cannot be deleted."
      operationId: deleteTool
      responses:
        "204":
          description: "Tool deleted"
        "400":
          description: "Tool not found or attempt to delete a system tool"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. Cannot delete system tools"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/pals/{pal_id}/tools:
    parameters:
      - name: pal_id
        in: path
        required: true
        description: "The unique identifier of the PAL."
        schema:
          type: string
          example: "p12345"
    post:
      tags:
        - PAL Tools
      summary: Attach Tools To PAL
      description: |
        Attach one or more tools (by `tool_id`) to a PAL. A PAL can have at most 50 attached tools.

        Attaching a tool that is already attached is idempotent - it is reported in the response alongside any newly-attached tools.
      operationId: attachToolsToPersona
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - tool_ids
              properties:
                tool_ids:
                  type: array
                  items:
                    type: string
                  description: "List of `tool_id` values to attach. Must not be empty; at most 50 per request."
                  example: ["tabc123def456", "tdef456abc789"]
      responses:
        "200":
          description: "Tools attached"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: "All tools that are now attached to the PAL, including ones that were already attached before this request."
                    items:
                      $ref: "#/components/schemas/tool"
        "400":
          description: "PAL not found, unknown `tool_id`, or PAL tool limit exceeded"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. One or more tool_ids not found"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []
    get:
      tags:
        - PAL Tools
      summary: List PAL Tools
      description: "List all standalone tools currently attached to a PAL. Inline tools defined under `PAL.layers.llm.tools` and built-in system tools are not returned here - only tools created via [Create Tool](/api-reference/tools/create-tool) and attached to this PAL."
      operationId: listPersonaTools
      responses:
        "200":
          description: "Attached tools returned"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/tool"
        "400":
          description: "PAL not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. PAL not found"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/pals/{pal_id}/tools/{tool_id}:
    parameters:
      - name: pal_id
        in: path
        required: true
        description: "The unique identifier of the PAL."
        schema:
          type: string
          example: "p12345"
      - name: tool_id
        in: path
        required: true
        description: "The unique identifier of the tool."
        schema:
          type: string
          example: "tabc123def456"
    delete:
      tags:
        - PAL Tools
      summary: Detach Tool From PAL
      description: "Detach a tool from a PAL. The tool itself is not deleted - it remains available to attach to other PALs."
      operationId: detachToolFromPersona
      responses:
        "204":
          description: "Tool detached"
        "400":
          description: "PAL not found, tool not found, or tool was not attached to this PAL"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request. Tool not attached to this PAL"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/skills:
    get:
      tags:
        - Skills
      summary: List Skills
      description: |
        List every skill in the registry. Skills are pre-built capabilities authored by Tavus that you can attach to a PAL - see [Skills](/sections/conversational-video-interface/skills/overview).
      operationId: listSkills
      responses:
        "200":
          description: "Successfully retrieved the skill registry"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        skill_id:
                          type: string
                          description: "The unique identifier of the skill. Used as the path parameter on the PAL skill endpoints."
                          example: "internet_search"
                        display_name:
                          type: string
                          example: "Internet Search"
                        description:
                          type: string
                          example: "Lets the PAL answer questions with up-to-date information from the web."
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/skills/{skill_id}:
    get:
      tags:
        - Skills
      summary: Get Skill
      description: |
        Retrieve the metadata for a single skill in the registry.
      operationId: getSkill
      responses:
        "200":
          description: "Successfully retrieved the skill"
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill_id:
                    type: string
                    example: "presentation"
                  display_name:
                    type: string
                    example: "Presentation"
                  description:
                    type: string
                    example: "Let the PAL walk participants through a slide deck made from uploaded documents."
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unknown skill 'my_skill'"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    parameters:
      - name: skill_id
        in: path
        required: true
        description: "The unique identifier of the skill."
        schema:
          type: string
          example: "internet_search"

  /v2/pals/{pal_id}/skills:
    get:
      tags:
        - Skills
      summary: List PAL Skills
      description: |
        List the skills attached to a PAL. The response is an object keyed by `skill_id`.
      operationId: listPersonaSkills
      responses:
        "200":
          description: "Successfully retrieved the PAL's skill attachments"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: "Skill attachments keyed by `skill_id`."
                    additionalProperties:
                      $ref: "#/components/schemas/SkillAttachment"
                    example:
                      internet_search:
                        skill_id: "internet_search"
                        config: {}
                        attached_at: "2026-06-10T14:30:45.123456+00:00"
                        updated_at: "2026-06-10T14:30:45.123456+00:00"
                      presentation:
                        skill_id: "presentation"
                        config:
                          document_ids: ["d1234567890", "d2468101214"]
                          slides_trigger: "walk_the_deck"
                          prompt: "Walk the participant through the Q4 roadmap deck."
                        attached_at: "2026-06-10T13:15:20.654321+00:00"
                        updated_at: "2026-06-10T14:25:10.987654+00:00"
                      magic_canvas:
                        skill_id: "magic_canvas"
                        config:
                          components:
                            chart:
                              enabled: false
                        attached_at: "2026-06-10T12:00:00.000000+00:00"
                        updated_at: "2026-06-10T12:00:00.000000+00:00"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "PAL not found"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    put:
      tags:
        - Skills
      summary: Replace PAL Skills
      description: |
        Replace a PAL's entire skill set in one call. Skills not present in the request are detached.
      operationId: replacePersonaSkills
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skills:
                  type: object
                  description: "The complete skill set for the PAL, keyed by `skill_id`. Each value holds that skill's `config` object (omit or pass `{}` for skills with no configuration)."
                  additionalProperties:
                    type: object
                    properties:
                      config:
                        type: object
                        description: "The configuration for this skill. Validated against the skill's config schema."
                  example:
                    internet_search: {}
                    presentation:
                      config:
                        document_ids: ["d1234567890"]
                        slides_trigger: "on_demand"
                    magic_canvas:
                      config: {}
              required:
                - skills
        required: true
      responses:
        "200":
          description: "Successfully replaced the PAL's skill attachments"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: "The PAL's new skill attachments keyed by `skill_id`."
                    additionalProperties:
                      $ref: "#/components/schemas/SkillAttachment"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request: {'skills': {'presentation': {'config': {'document_ids': ['Missing data for required field.']}}}}"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unknown skill 'my_skill'"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    parameters:
      - name: pal_id
        in: path
        required: true
        description: "The unique identifier of the PAL."
        schema:
          type: string
          example: "pcb7a34da5fe"

  /v2/pals/{pal_id}/skills/{skill_id}:
    get:
      tags:
        - Skills
      summary: Get PAL Skill
      description: |
        Retrieve a single skill attachment on a PAL.
      operationId: getPersonaSkill
      responses:
        "200":
          description: "Successfully retrieved the skill attachment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillAttachment"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Skill 'presentation' is not attached to this PAL"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "PAL not found"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    put:
      tags:
        - Skills
      summary: Attach Skill to PAL
      description: |
        Attach a skill to a PAL, or overwrite the configuration of an existing attachment. The skill is active on the PAL's next conversation.

        Skills with no configuration (like `internet_search`) take an empty body or `{"config": {}}`. See [Skills](/sections/conversational-video-interface/skills/overview) for each skill's configuration fields. For `magic_canvas`, see [Canvas configuration](/sections/conversational-video-interface/magic-canvas/api/configuration).
      operationId: attachSkillToPersona
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  description: |
                    The configuration for the skill, validated against the skill's config schema. Defaults to `{}`.

                    - `presentation`: `document_ids` (required array), optional `slides_trigger` (`on_demand` (default) or `walk_the_deck`), optional `prompt`.
                    - `magic_canvas`: optional sparse `components` overlay, plus optional `usage_guidance` (string, max 2048 characters) appended to the Canvas system prompt to steer when the PAL shows cards. Ignored when blank or when no Canvas component is active. See [Canvas configuration](/sections/conversational-video-interface/magic-canvas/api/configuration).
                  example:
                    document_ids: ["d1234567890", "d2468101214"]
                    slides_trigger: "walk_the_deck"
                    prompt: "Walk the participant through the Q4 roadmap deck."
            examples:
              no_config:
                summary: Skill without configuration
                value:
                  config: {}
              presentation:
                summary: Presentation skill
                value:
                  config:
                    document_ids: ["d1234567890", "d2468101214"]
                    slides_trigger: "walk_the_deck"
                    prompt: "Walk the participant through the Q4 roadmap deck."
              magic_canvas:
                summary: Magic Canvas skill
                value:
                  config:
                    usage_guidance: "Show a chart whenever you compare numbers; ask with a question card before booking."
                    components:
                      scheduling_embed:
                        provider: "calendly"
                        scheduling_url: "https://calendly.com/your-team/30min"
      responses:
        "200":
          description: "Successfully attached the skill"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillAttachment"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request: {'document_ids': ['Missing data for required field.']}"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unknown skill 'my_skill'"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    patch:
      tags:
        - Skills
      summary: Update PAL Skill
      description: |
        Merge changes into an existing skill attachment's configuration. Fields you pass replace the existing values, fields you omit are preserved, and fields set to `null` are removed. The merged configuration is validated against the skill's config schema.

        Unlike [Attach Skill to PAL](/api-reference/pal-skills/attach-skill-to-pal), this endpoint cannot create a new attachment - the skill must already be attached.
      operationId: updatePersonaSkill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  description: "Partial configuration to merge into the existing config."
                  example:
                    slides_trigger: "on_demand"
              required:
                - config
        required: true
      responses:
        "200":
          description: "Successfully updated the skill attachment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillAttachment"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request: {'config': ['Missing data for required field.']}"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Skill 'presentation' is not attached to this PAL"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    delete:
      tags:
        - Skills
      summary: Detach Skill from PAL
      description: |
        Detach a skill from a PAL. The skill no longer applies to the PAL's future conversations. The skill itself stays in the registry and can be re-attached at any time.
      operationId: detachSkillFromPersona
      responses:
        "204":
          description: "Successfully detached the skill"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Skill 'presentation' is not attached to this PAL"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "PAL not found"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    parameters:
      - name: pal_id
        in: path
        required: true
        description: "The unique identifier of the PAL."
        schema:
          type: string
          example: "pcb7a34da5fe"
      - name: skill_id
        in: path
        required: true
        description: "The unique identifier of the skill."
        schema:
          type: string
          example: "presentation"

  /v2/transcriptions:
    post:
      tags:
        - Transcriptions
      summary: Create Transcription
      description: |
        This endpoint creates a transcription request that will convert speech to text in your video content.
      operationId: createTranscription
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file_url:
                  type: string
                  description: "A direct link to the video that will be transcribed. This should be a publicly accessible / presigned S3 URL."
                  example: "https://example.com/video.mp4"
                callback_url:
                  type: string
                  description: "A url that will receive a callback on completion of the transcription or on error."
                  example: "https://your-callback-url.com"
              required:
                - file_url
                - callback_url
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcription_id:
                    type: string
                    example: "t0108f2d24k2a"
                    description: "A unique identifier for the transcription."
                  status:
                    type: string
                    description: "The status of the transcription."
                  callback_url:
                    type: string
                    description: "The callback URL provided in the request."
                    example: "https://your-callback-url.com"
      security:
        - apiKey: []

    get:
      tags:
        - Transcriptions
      summary: List Transcriptions
      description: |
        This endpoint returns a list of all Transcriptions created by the account associated with the API Key in use.
      operationId: listTranscriptions
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: "The number of transcriptions to return per page. Default is 10."
        - in: query
          name: page
          schema:
            type: integer
          description: "The page number to return. Default is 1."
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transcription_id:
                          type: string
                          description: "A unique identifier for the transcription."
                          example: "t0108f2d24k2a"
                        file_url:
                          type: string
                          description: "The URL of the file that was transcribed."
                          example: "https://example.com/video.mp4"
                        text:
                          type: string
                          description: "The transcribed text from the video."
                        status:
                          type: string
                          description: "The status of the transcription. Can be either `started`, `completed`, or `error`."
                        created_at:
                          type: string
                          description: "The date and time the transcription was created."
                  total_count:
                    type: integer
                    description: "The total number of transcriptions that fit the query."
      security:
        - apiKey: []

  /v2/objectives:
    post:
      tags:
        - Objectives
      summary: Create Objectives
      description: |
        This endpoint creates objectives for a PAL.
      operationId: createObjectives
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  description: "Array of objectives to create. Objectives provide goal-oriented instructions that help guide conversations toward specific achievements and desired outcomes."
                  items:
                    type: object
                    properties:
                      objective_name:
                        type: string
                        description: "A descriptive name for the objective. This must be a string value without spaces."
                        example: "ask_if_new_patient"
                      objective_prompt:
                        type: string
                        description: "The detailed prompt that defines what the objective should accomplish."
                        example: "Ask the patient if they are new or have been here before"
                      confirmation_mode:
                        type: string
                        description: "How the objective completion should be confirmed. If set to `manual`, the user will be prompted to confirm the objective completion. If set to `auto`, the LLM will determine whether the objective was completed or not."
                        enum:
                          - "auto"
                          - "manual"
                        default: "auto"
                        example: "auto"
                      output_variables:
                        type: array
                        description: "Optional list of variables that should be extracted or collected during the objective."
                        items:
                          type: string
                        example: ["patient_status"]
                      modality:
                        type: string
                        description: "The communication modality for the objective. If set to `verbal`, the objective will be completed by the user's responses. If set to `visual`, the objective can only be completed by visual / perception cues observed by Raven."
                        enum:
                          - "verbal"
                          - "visual"
                        default: "verbal"
                        example: "verbal"
                      next_conditional_objectives:
                        type: object
                        description: "A mapping of objective names to conditions that must be satisfied for that objective to be activated once this objective is completed. Use this to write multiple conditional objectives."
                        additionalProperties:
                          type: string
                        example:
                          new_patient_intake_process: "If the patient has never been to the practice before"
                          existing_patient_intake_process: "If the patient has been to the practice before"
                      next_required_objective:
                        type: string
                        description: "The name of the next required objective that will be activated once the current objective is completed. Use this to write a single next required objective without conditions."
                        example: "get_patient_name"
                      callback_url:
                        type: string
                        description: "Optional URL that will receive notifications when the objective is completed."
                        example: "https://your-server.com/webhook"
                    required:
                      - objective_name
                      - objective_prompt
              required:
                - data
      responses:
        "200":
          description: "Objective created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectives_id:
                    type: string
                    description: "Unique identifier for the created objective"
                    example: "o12345"
                  objective_name:
                    type: string
                    description: "Name of the objective"
                    example: "New Objectives"
                  status:
                    type: string
                    description: "Current status of the objective"
                    example: "active"
                  created_at:
                    type: string
                    description: "ISO 8601 timestamp of when the objective was created"
                    example: "2024-01-15T10:30:00Z"
        "400":
          description: "Bad Request - Invalid input parameters"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "Error message describing the validation failure"
                    example: "objective_name is required"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
      security:
        - apiKey: []
    get:
      tags:
        - Objectives
      summary: Get Objectives
      description: |
        This endpoint returns a list of all objectives.
      operationId: getObjectives
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: "The number of objectives to return per page. Default is 10."
        - in: query
          name: page
          schema:
            type: integer
          description: "The page number to return. Default is 1."
      responses:
        "200":
          description: "Successfully retrieved objectives"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: "Objectives for the current page; use `total_count` for the full count."
                    items:
                      type: object
                      properties:
                        objectives_id:
                          type: string
                          description: "Unique identifier for the objective"
                          example: "o12345"
                        objective_name:
                          type: string
                          description: "Name of the objective"
                          example: "ask_if_new_patient"
                        objective_prompt:
                          type: string
                          description: "The detailed prompt that defines what the objective should accomplish"
                          example: "Ask the patient if they are new or have been here before"
                        confirmation_mode:
                          type: string
                          description: "How the objective completion should be confirmed"
                          example: "auto"
                        output_variables:
                          type: array
                          description: "List of variables that should be extracted or collected during the objective"
                          items:
                            type: string
                          example: ["patient_status"]
                        modality:
                          type: string
                          description: "The communication modality for the objective"
                          example: "verbal"
                        next_conditional_objectives:
                          type: object
                          description: "Mapping of objective names to conditions that must be satisfied for that objective to be activated. Use this to write multiple conditional objectives"
                          additionalProperties:
                            type: string
                          example:
                            new_patient_intake_process: "If the patient has never been to the practice before"
                            existing_patient_intake_process: "If the patient has been to the practice before"
                        next_required_objective:
                          type: string
                          description: "The name of the next required objective that will be activated once the current objective is completed. Use this to write a single next required objective without conditions"
                          example: "get_patient_name"
                        callback_url:
                          type: string
                          description: "URL that will receive notifications when the objective is completed"
                          example: "https://your-server.com/webhook"
                        created_at:
                          type: string
                          description: "ISO 8601 timestamp of when the objective was created"
                          example: "2024-01-15T10:30:00Z"
                        updated_at:
                          type: string
                          description: "ISO 8601 timestamp of when the objective was last updated"
                          example: "2024-01-15T10:30:00Z"
                  total_count:
                    type: integer
                    description: "The total number of objectives"
                    example: 25
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
      security:
        - apiKey: []

