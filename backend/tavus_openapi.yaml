  /v2/deployments/{deployment_id}:
    get:
      tags:
        - Deployments
      summary: Get Deployment
      operationId: getDeployment
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
          description: "Deployment UUID."
      responses:
        "200":
          description: "Deployment details"
          headers:
            ETag:
              description: "Weak ETag from `updated_at`. Pass as `If-Match` on PATCH."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deployment"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Deployment not found"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []
    patch:
      tags:
        - Deployments
      summary: Patch Deployment
      description: |
        Apply a [JSON Patch](https://jsonpatch.com/) array to the deployment document.

        Send the `ETag` from GET as `If-Match` for optimistic concurrency.
      operationId: patchDeployment
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: "ETag from a prior GET response."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
              example:
                - op: replace
                  path: /name
                  value: "Support widget"
      responses:
        "200":
          description: "Updated deployment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deployment"
        "404":
          description: "Not Found"
        "422":
          description: "Invalid JSON Patch"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid JSON patch format"
        "401":
          description: "UNAUTHORIZED"
      security:
        - apiKey: []
    delete:
      tags:
        - Deployments
      summary: Delete Deployment
      operationId: deleteDeployment
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Deployment deleted"
        "404":
          description: "Not Found"
        "401":
          description: "UNAUTHORIZED"
      security:
        - apiKey: []

