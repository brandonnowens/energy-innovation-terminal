                    example: "r90bbd427f71"
                    description: "The default face_id associated with this PAL if one exists."
                  conferencing_email:
                    type: string
                    nullable: true
                    description: "The PAL's invitable meeting email on `tavusinvite.com`, derived from `layers.conferencing.username`. Present when conferencing is configured."
                    example: "acme-anna@tavusinvite.com"
                  disclosure_type:
                    type: string
                    description: "AI disclosure setting for [EU AI Act](/sections/onboarding-guide/eu-ai-act) compliance. `always`, `auto` (default, follows the conversation's `policy` param), or `off`."
                    enum:
                      - "always"
                      - "auto"
                      - "off"
                    default: "auto"
                    example: "auto"
                  verbal_disclosure:
                    type: string
                    description: "Text the PAL speaks before its greeting when `disclosure_type` fires. Empty falls back to \"Just a note, I am an AI system, not a person.\""
                    example: "Just so you know, you're speaking with an AI agent from Acme."
                  visual_disclosure:
                    type: string
                    description: "Text shown as an on-screen banner when `disclosure_type` fires. Empty falls back to \"You are interacting with an AI system.\""
