      description: |
        Lists your [Voice](/sections/conversational-video-interface/voices) resources.

        **Send `source`.** It selects which voices to return and is what makes this endpoint return Voice resources at all:

        ```bash
        GET /v2/voices?source=user     # voices you created
        GET /v2/voices?source=system   # the Tavus catalog
        GET /v2/voices?source=all      # both
        ```

        <Note>
        Omitting `source` returns a legacy stock-voice listing instead: `voice_name` slugs and their linked face metadata, with `page` and `limit` echoed in the response. It carries no `voice_id` values and cannot see voices you created.
