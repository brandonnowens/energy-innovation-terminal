                          tools:
                            type: array
                            description: "**Legacy.** Inline OpenAI-style function tools on the PAL. Deprecated - use [Create Tool](/api-reference/tools/create-tool) and [Attach Tools to PAL](/api-reference/pal-tools/attach-tools-to-pal). See [Legacy inline tool calling](/sections/troubleshooting#legacy-inline-tool-calling)."
                            example:
                              [
                                {
                                  "type": "function",
                                  "function":
                                    {
                                      "name": "get_current_weather",
                                      "description": "Get the current weather in a given location",
                                      "parameters":
