                    description: "The error message."
                    example: "Objective not found"
      security:
        - apiKey: []

    parameters:
      - name: objectives_id
        in: path
        required: true
        description: "The unique identifier of the objective."
        schema:
          type: string
          example: "o12345"

  /v2/guardrails:
    post:
      tags:
        - Guardrails
      summary: Create Guardrails
      description: |
        Create a new guardrail. Guardrails provide strict behavioral boundaries that are enforced throughout a conversation.

        Attach guardrails to a PAL directly via `guardrail_ids` or by tag via `guardrail_tags` on [Create PAL](/api-reference/pals/create-pal).

        <Note>
        See [Deprecated guardrail sets](/api-reference/guardrails/legacy-guardrail-sets).
        </Note>
      operationId: createGuardrails
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guardrail_name:
                  type: string
                  maxLength: 100
                  description: "A descriptive name for the guardrail. Only alphanumeric characters and underscores are allowed. Maximum 100 characters."
                  example: "healthcare_compliance_guardrail"
                guardrail_prompt:
                  type: string
                  maxLength: 1000
                  description: "The detailed prompt that defines the behavioral boundaries and restrictions. Keep this short and direct for best enforcement. Maximum 1,000 characters."
                  example: "Never discuss competitor products, share sensitive medical information, or provide medical advice outside approved guidelines."
                modality:
                  type: string
                  description: "The communication modality for the guardrail. If set to `verbal`, the guardrail is enforced against the participant's spoken/typed responses. If set to `visual`, the guardrail is enforced against visual/perception cues observed by Raven."
                  enum:
                    - "verbal"
                    - "visual"
                  default: "verbal"
                  example: "verbal"
                callback_url:
                  type: string
                  maxLength: 2048
                  description: "Optional URL that will receive a notification when the guardrail is triggered during a conversation. Maximum 2,048 characters."
                  example: "https://your-server.com/guardrails-webhook"
                tags:
                  type: array
                  maxItems: 32
                  description: "Optional tags for organizing guardrails and for attaching them to PALs in bulk via `guardrail_tags` on [Create PAL](/api-reference/pals/create-pal). Up to 32 tags per guardrail. Tag names are limited to 64 characters."
                  items:
                    type: string
                    maxLength: 64
                  example: ["compliance", "healthcare"]
                app_message:
                  type: boolean
                  description: "Whether triggering this guardrail emits a real-time app-message event on the conversation. Default `true`. Set to `false` to suppress the in-conversation event for guardrails you only want to observe server-side via `callback_url`."
                  default: true
                  example: true
              required:
                - guardrail_name
                - guardrail_prompt
            examples:
              minimal:
                summary: Required fields only
                value:
                  guardrail_name: "no_competitors"
                  guardrail_prompt: "Only mention products within Our Company Inc. during conversations; never discuss competitors."
              with_tags:
                summary: Guardrail with tags for tag-based attachment
                value:
                  guardrail_name: "healthcare_compliance"
                  guardrail_prompt: "Never share sensitive medical information or provide medical advice outside approved guidelines."
                  modality: "verbal"
                  callback_url: "https://your-server.com/guardrails-webhook"
                  tags: ["compliance", "healthcare"]
      responses:
        "200":
          description: "Guardrail created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    description: "Unique identifier for the created guardrail. Use this value in `guardrail_ids` on a PAL."
                    example: "g1234567890ab"
                  guardrail_name:
                    type: string
                    example: "healthcare_compliance_guardrail"
                  guardrail_prompt:
                    type: string
                    example: "Never share sensitive medical information or provide medical advice outside approved guidelines."
                  modality:
                    type: string
                    enum:
                      - "verbal"
                      - "visual"
                    example: "verbal"
                  callback_url:
                    type: string
                    example: "https://your-server.com/guardrails-webhook"
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["compliance", "healthcare"]
                  app_message:
                    type: boolean
                    description: "Whether triggering this guardrail emits a real-time app-message event on the conversation."
                    example: true
                  created_at:
                    type: string
                    example: "2024-01-15T10:30:00Z"
                  updated_at:
                    type: string
                    example: "2024-01-15T10:30:00Z"
        "400":
          description: "Bad Request - Invalid input parameters"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "guardrail_name is required"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []
    get:
      tags:
        - Guardrails
      summary: List Guardrails
      description: |
        Return a flat list of guardrails owned by the caller. Pass `legacy=false` - recommended for all new integrations. The `legacy=true` behavior returns the deprecated guardrail set list.
      operationId: listGuardrails
      parameters:
        - in: query
          name: legacy
          schema:
            type: string
            enum: ["true", "false"]
          description: "**Pass `false`** to return individual guardrails (recommended). Defaults to `true` for backwards compatibility, which returns the deprecated guardrail set list."
          example: "false"
        - in: query
          name: limit
          schema:
            type: integer
          description: "Number of guardrails to return per page. Default is 10."
          example: 10
        - in: query
          name: page
          schema:
            type: integer
          description: "Page number (0-indexed when `legacy=false`). Default is 0."
          example: 0
        - in: query
          name: sort
          schema:
            type: string
            enum: ["ascending", "descending"]
          description: "Sort direction. Default is `ascending`."
        - in: query
          name: name_or_uuid
          schema:
            type: string
          description: "Filter results by guardrail name or UUID."
        - in: query
          name: tags
          schema:
            type: string
          description: "Comma-separated list of tags to filter by. Any-match (OR) semantics."
          example: "compliance,healthcare"
      responses:
        "200":
          description: "Successfully retrieved guardrails"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: "Guardrails for the current page; use `total_count` for the full count under the applied filters."
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: "g1234567890ab"
                        guardrail_name:
                          type: string
                          example: "healthcare_compliance_guardrail"
                        guardrail_prompt:
                          type: string
                          example: "Never share sensitive medical information or provide medical advice outside approved guidelines."
                        modality:
                          type: string
                          enum:
                            - "verbal"
                            - "visual"
                          example: "verbal"
                        callback_url:
                          type: string
                          example: "https://your-server.com/guardrails-webhook"
                        tags:
                          type: array
                          items:
                            type: string
                          example: ["compliance", "healthcare"]
                        app_message:
                          type: boolean
                          description: "Whether triggering this guardrail emits a real-time app-message event on the conversation."
                          example: true
                        created_at:
                          type: string
                          example: "2024-01-15T10:30:00Z"
                        updated_at:
                          type: string
                          example: "2024-01-15T10:30:00Z"
                  total_count:
                    type: integer
                    description: "Total number of guardrails matching the filter."
                    example: 15
                  page:
                    type: integer
                    example: 0
                  limit:
                    type: integer
                    example: 10
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/guardrails/tags:
    get:
      tags:
        - Guardrails
      summary: List Guardrail Tags
      x-hidden: true
      description: |
        List all guardrail tags owned by the caller, with the `guardrail_ids` associated with each tag. Mirrors `GET /v2/documents/tags`.
      operationId: listGuardrailTags
      parameters:
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: "Optional case-insensitive substring filter on tag name."
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: "1-indexed page number."
        - in: query
          name: limit
          schema:
            type: integer
          description: "Number of tags to return per page."
      responses:
        "200":
          description: "Successfully retrieved tags"
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                          example: "compliance"
                        guardrail_ids:
                          type: array
                          items:
                            type: string
                          example: ["g1234567890ab", "g0987654321cd"]
                  total_count:
                    type: integer
                    example: 5
        "401":
          description: "UNAUTHORIZED"
      security:
        - apiKey: []

  /v2/guardrails/{guardrail_id}:
    get:
      tags:
        - Guardrails
      summary: Get Guardrails
      description: |
        Retrieve a single guardrail by its unique identifier.
      operationId: getGuardrails
      responses:
        "200":
          description: "Successfully retrieved the guardrail"
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "g1234567890ab"
                  guardrail_name:
                    type: string
                    example: "healthcare_compliance_guardrail"
                  guardrail_prompt:
                    type: string
                    example: "Never share sensitive medical information or provide medical advice outside approved guidelines."
                  modality:
                    type: string
                    enum:
                      - "verbal"
                      - "visual"
                    example: "verbal"
                  callback_url:
                    type: string
                    example: "https://your-server.com/guardrails-webhook"
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["compliance", "healthcare"]
                  app_message:
                    type: boolean
                    description: "Whether triggering this guardrail emits a real-time app-message event on the conversation."
                    example: true
                  created_at:
                    type: string
                    example: "2024-01-15T10:30:00Z"
                  updated_at:
                    type: string
                    example: "2024-01-15T10:30:00Z"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Guardrail not found"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    patch:
      tags:
        - Guardrails
      summary: Patch Guardrails
      description: |
        Update specific fields of a guardrail using [JSON Patch](https://jsonpatch.com/) operations. Paths must match the **current** document shape - compare against the response from [Get Guardrails](/api-reference/guardrails/get-guardrails) before patching.
      operationId: patchGuardrails
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  op:
                    type: string
                    enum: ["add", "remove", "replace", "copy", "move", "test"]
                    example: "replace"
                  path:
                    type: string
                    description: "JSON Pointer (RFC 6901) to a field on the guardrail (e.g. `/guardrail_prompt`, `/tags`, `/modality`)."
                    example: "/guardrail_prompt"
                  value:
                    description: "The value used by the operation. Not required for `remove`."
                    example: "Updated prompt with stricter restrictions."
                required:
                  - op
                  - path
            examples:
              Update prompt:
                value:
                  - op: "replace"
                    path: "/guardrail_prompt"
                    value: "Never discuss competitor products under any circumstances."
              Add a tag:
                value:
                  - op: "add"
                    path: "/tags/-"
                    value: "compliance"
              Replace all tags:
                value:
                  - op: "replace"
                    path: "/tags"
                    value: ["compliance", "healthcare"]
              Remove callback URL:
                value:
                  - op: "remove"
                    path: "/callback_url"
              Suppress app message:
                value:
                  - op: "replace"
                    path: "/app_message"
                    value: false
      responses:
        "200":
          description: "Guardrail updated successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "g1234567890ab"
                  guardrail_name:
                    type: string
                  guardrail_prompt:
                    type: string
                  modality:
                    type: string
                  callback_url:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  app_message:
                    type: boolean
                    description: "Whether triggering this guardrail emits a real-time app-message event on the conversation."
                  updated_at:
                    type: string
        "304":
          description: "No changes were made to the guardrail"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid patch operation"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
        "422":
          description: "Invalid JSON patch format"
      security:
        - apiKey: []

    delete:
      tags:
        - Guardrails
      summary: Delete Guardrails
      description: |
        Delete a single guardrail by its unique identifier. PALs with this guardrail attached via `guardrail_ids` will have the reference removed automatically.
      operationId: deleteGuardrails
      responses:
        "204":
          description: "NO CONTENT - Guardrail deleted successfully"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Guardrail not found"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
      security:
        - apiKey: []

    parameters:
      - name: guardrail_id
        in: path
        required: true
        description: "The unique identifier of the guardrail."
        schema:
          type: string
          example: "g1234567890ab"

  /v2/documents:
    post:
      tags:
        - Documents
      summary: Create Document
      description: Upload documents to your knowledge base for PALs to reference during conversations.
      operationId: createDocument
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                document_url:
                  type: string
                  description: |
                    Direct URL to a file or a website for your [Knowledge Base](/sections/conversational-video-interface/knowledge-base). Submitting this URL starts processing **asynchronously**; the document can be used in conversations once processing completes, which may take **a few minutes** depending on file size.

                    <Note>
                    For now, our Knowledge Base only supports documents written in English and works best for conversations in English. We will be expanding our Knowledge Base language support soon.
                    </Note>

                    Maximum file size **50MB**. Supported file formats: `.pdf`, `.txt`, `.docx`, `.doc`, `.png`, `.jpg`, `.pptx`, `.csv`, and `.xlsx`. Website URLs are supported: a snapshot of the page is processed into document content; use the `crawl` object for multi-page crawling from a starting URL.
                  example: "https://docs.example.com/"
                document_name:
                  type: string
                  description: "Optional name for the document. If not provided, a default name will be generated."
                  example: "Example Docs"
                callback_url:
                  type: string
                  description: "Optional URL that receives status updates while the document processes asynchronously (e.g. started, processing, ready, error)."
                  example: "https://your-server.com/webhook"
                tags:
                  type: array
                  description: |
                    Optional tags to categorize the document for management and for use with document-based access in conversations. After the document is ready, attach it via `document_ids` on [Create PAL](/api-reference/pals/create-pal) or [Create Conversation](/api-reference/conversations/create-conversation).
                  items:
                    type: string
                  example: ["docs", "website"]
                crawl:
                  type: object
                  description: |
                    Optional configuration for website crawling. When provided with a website URL, the system follows links from the starting URL and processes multiple pages into a single document. Without this parameter, only the single page at the URL is scraped.

                    **Rate limits:** at most **100** crawl documents per user, at most **5** concurrent crawls at any time, and a **1-hour cooldown** between recrawls of the same document.

                    To fetch fresh content after a crawled document exists, use [Recrawl Document](/api-reference/documents/recrawl-document).
                  properties:
                    depth:
                      type: integer
                      description: "How many levels deep to follow links from the starting URL (1-10). A depth of 1 means only pages directly linked from the starting URL."
                      minimum: 1
                      maximum: 10
                      example: 2
                    max_pages:
                      type: integer
                      description: "Maximum number of pages to crawl (1-100). Processing stops once this limit is reached."
                      minimum: 1
                      maximum: 100
                      example: 10
              required:
                - document_url
            examples:
              minimal:
                summary: Required fields only
                value:
                  document_url: "https://docs.example.com/"
              with_crawl:
                summary: Website with multi-page crawl
                value:
                  document_name: "Company Knowledge Base"
                  document_url: "https://docs.example.com/"
                  crawl:
                    depth: 2
                    max_pages: 20
                  callback_url: "https://your-server.com/webhook"
      responses:
        "200":
          description: "Document created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id:
                    type: string
                    description: "Unique identifier for the created document"
                    example: "d8-5c71baca86fc"
                  document_name:
                    type: string
                    description: "Name of the document"
                    example: "Example Docs"
                  document_url:
                    type: string
                    description: "URL of the document or website"
                    example: "https://docs.example.com/"
                  status:
                    type: string
                    description: "Current status of the document processing. Possible values: `started`, `processing`, `ready`, `error`, `recrawling`."
                    enum:
                      - started
                      - processing
                      - ready
                      - error
                      - recrawling
                    example: "started"
                  progress:
                    type: integer
                    nullable: true
                    description: "Processing progress as a percentage (0-100). Null when processing has not started or is complete."
                    example: null
                  error_message:
                    type: string
                    nullable: true
                    description: "Error code indicating why processing failed. Only present when status is `error`. Possible values include: `file_download_failed`, `file_format_unsupported`, `file_size_too_large`, `file_empty`, `invalid_file_url`, `document_processing_failed`, `website_processing_failed`, `chunking_failed`, `embedding_failed`, `vector_store_failed`, `contact_support`."
                  created_at:
                    type: string
                    description: "ISO 8601 timestamp of when the document was created"
                    example: "2024-01-01T12:00:00Z"
                  updated_at:
                    type: string
                    description: "ISO 8601 timestamp of when the document was last updated"
                    example: "2024-01-01T12:00:00Z"
                  callback_url:
                    type: string
                    description: "URL that will receive status updates"
                    example: "https://your-server.com/webhook"
                  tags:
                    type: array
                    description: "Array of document tags"
                    items:
                      type: string
                    example: ["docs", "website"]
                  crawl_config:
                    type: object
                    nullable: true
                    description: "The crawl configuration used for this document (only present for crawled websites)"
                    properties:
                      depth:
                        type: integer
                        description: "Crawl depth setting"
                        example: 2
                      max_pages:
                        type: integer
                        description: "Maximum pages setting"
                        example: 10
                  crawled_urls:
                    type: array
                    nullable: true
                    description: "List of URLs that were crawled (only present for crawled websites after processing completes)"
                    items:
                      type: string
                    example: ["https://docs.example.com/", "https://docs.example.com/getting-started", "https://docs.example.com/api"]
                  last_crawled_at:
                    type: string
                    nullable: true
                    description: "ISO 8601 timestamp of when the document was last crawled"
                    example: "2024-01-01T12:00:00Z"
                  crawl_count:
                    type: integer
                    nullable: true
                    description: "Number of times the document has been crawled"
                    example: 1
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "The error message"
                    example: "Invalid request: document_url is required"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message"
                    example: "Invalid access token"
        "429":
          description: "Too Many Requests - Crawl rate limit exceeded"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "The error message"
                    example: "Crawl document limit reached (100). Contact support@tavus.io to increase your limit."
      security:
        - apiKey: []

    get:
      tags:
        - Documents
      summary: List Documents
      description: |
