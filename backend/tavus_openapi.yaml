      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                face_name:
                  type: string
                  description: "A new name for the face. Cannot be null or blank."
                  example: "Ana"
                default_voice_id:
                  type: string
                  description: "The [Voice](/sections/conversational-video-interface/voices) this face speaks with when a PAL sets no voice of its own. Cannot be null or blank; a face with no default simply leaves nothing to resolve."
                  example: "v0a1b2c3d4e5f"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  face_id:
                    type: string
                    example: "r90bbd427f71"
                  face_name:
                    type: string
                    example: "Ana"
                  default_voice_id:
                    type: string
                    nullable: true
                    example: "v0a1b2c3d4e5f"
                  original_voice_id:
                    type: string
                    nullable: true
                    description: "The voice this face was created with, read-only."
                    example: "v000000000001"
        "400":
          description: "BAD REQUEST"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "default_voice_id cannot be null or blank"
        "401":
          description: "UNAUTHORIZED"
      security:
        - apiKey: []

