  /v2/faces:
    get:
      tags:
        - Faces
      summary: List Faces
      description: |
        Returns all faces (photorealistic likenesses trained with Phoenix) created by the account associated with the API key.

        **Legacy:** `/v2/replicas` and `replica_id` / `replica_ids` remain supported as aliases.
      operationId: listFaces
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: "The number of faces to return per page."
        - in: query
          name: page
          schema:
            type: integer
          description: "The page number to return"
        - in: query
          name: verbose
          schema:
            type: boolean
          description: "If set to true, the response will include additional face data such as the face type."
        - in: query
          name: face_type
          schema:
            type: string
            enum:
              - user
              - system
          description: "If set to user, the response will only include user faces. If set to system, the response will only include stock faces."
        - in: query
          name: face_ids
          schema:
            type: string
          description: "A comma separated list of face ids to filter the response by. Example: `face_ids=r90bbd427f71`"
        - in: query
          name: model_name
          schema:
            type: string
          description: "Filter the list to faces trained on a specific Phoenix model (e.g. `phoenix-3`, `phoenix-4`)."
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: "Faces for the current page; use `total_count` for the full count under the applied filters."
                    items:
                      type: object
                      properties:
                        face_id:
                          type: string
                          example: "r90bbd427f71"
                          description: "A unique identifier for the face."
                        face_name:
                          type: string
                          example: "My Face"
                          description: "The name of the face."
                        default_voice_id:
                          type: string
                          nullable: true
                          example: "v0a1b2c3d4e5f"
                          description: "The [Voice](/sections/conversational-video-interface/voices) this face speaks with when a PAL sets no voice of its own. Null if the face has none."
                        original_voice_id:
                          type: string
                          nullable: true
                          example: "v0a1b2c3d4e5f"
                          description: "The voice this face was created with, read-only. Set `default_voice_id` back to this id to revert a face to its original voice."
                        thumbnail_video_url:
                          type: string
                          description: "A direct link to the video that will be used as the thumbnail for the face."
                        training_progress:
                          type: string
                          example: "100/100"
                          description: "Training progress as a string (for example `100/100`)."
                        status:
                          type: string
                          example: "completed"
                          description: "Training lifecycle: `started`, `completed`, or `error`."
                        created_at:
                          type: string
                        face_type:
                          type: string
                          example: user'
                          description: "If `verbose` query paramter is set to true. The type of face. Possible values: user, system. User faces are faces that have been created by users. System faces are stock Tavus faces that anyone may use"
                        model_name:
                          type: string
                          example: "phoenix-3"
                          description: "The Phoenix model the face was trained on (e.g. `phoenix-3`, `phoenix-4`)."
                  total_count:
                    type: integer
                    description: "The total number of faces given the filters provided."
                    example: 42
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
      security:
        - apiKey: []

    post:
      tags:
        - Faces
      summary: Create Face
      description: Creates a new face from training video or image URL for use in conversations. See [Which training path?](/sections/faces/which-training-path) for footage requirements and [Face overview](/sections/faces/overview#platform-policies) for rights and permissions.
      operationId: createFace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_video_url:
                  deprecated: true
                  x-mint:
                    groups: ["legacy"]
                  type: string
                  description: |
                    **Legacy.** Optional URL to a separate consent recording used with older video-training flows. New integrations should not send this field. Ensure you have the necessary rights and permissions to use any training footage - see [Platform Policies](/sections/faces/overview#platform-policies).
                  example: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-consent-video.mp4"
                train_video_url:
                  type: string
                  description: |
                    A direct download link such as a **presigned S3 URL** or other publicly reachable file used for video-based face training. Do not send `train_image_url` in the same request.

                    The file must meet [training video requirements](/sections/troubleshooting/training-video-size).

                    You must have the necessary rights and permissions to use the likeness, voice, and footage you submit. See [Platform Policies](/sections/faces/overview#platform-policies).
                  example: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-train-video.mp4"
                train_image_url:
                  type: string
                  description: "A direct link to a publicly accessible image used for image-to-face training. Requires `voice_name`. Do not send `train_video_url` in the same request. You must have the necessary rights and permissions to use the likeness and image. See [Training from an image](/sections/faces/train-with-an-image) and [Platform Policies](/sections/faces/overview#platform-policies)."
                  example: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-train-image.png"
                voice_name:
                  type: string
                  description: "Required when `train_image_url` is set. Slug that selects the voice from an existing Tavus stock face (case-insensitive, e.g. `anna`). If supplied with `train_video_url`, the name is still validated when present. Use [List Voices](/api-reference/voices/list-voices) to discover valid slugs; see also [example `voice_name` values](/sections/faces/train-with-an-image#example-voice-name-table)."
                  example: "anna"
                default_voice_id:
                  type: string
                  description: "A [Tavus Voice](/sections/conversational-video-interface/voices) to use as this face's default, e.g. `v0a1b2c3d4e5f`. A PAL that names this face then needs no TTS configuration at all. Image-to-face only, and an alternative to `voice_name`, send one, not both. Video-to-face does not take this field: a voice is created from the training video's own audio and set as the default. Change it afterwards with [Update Face](/api-reference/faces/update-face)."
                  example: "v0a1b2c3d4e5f"
                auto_fix_training_image:
                  type: boolean
                  description: "When set to `true`, Tavus's AI Image Fixer instantly fixes any uploaded image to fit our [image requirements](/sections/faces/train-with-an-image#image-requirements), eliminating the need for editing or recapturing photos. Only applies to image-based training (`train_image_url`)."
                  example: true
                callback_url:
                  type: string
                  description: "A url that will receive a callback on completion of face training or on error."
                  example: "https://yourwebsite.com/webhook"
                face_name:
                  type: string
                  description: "A name for the face."
                  example: "Rio"
                model_name:
                  type: string
                  description: "The Phoenix model version used to train the face. Defaults to `phoenix-4`; set to `phoenix-3` for the older model."
                  example: "phoenix-4"
                properties:
                  type: object
                  properties:
                    background_green_screen:
                      type: boolean
                      description: "If set to true, the face will have a green screen background."
                      example: false
            examples:
              Video training:
                value:
                  callback_url: "https://yourwebsite.com/webhook"
                  face_name: "Rio"
                  train_video_url: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-train-video.mp4"
              Non-Human Face:
                value:
                  callback_url: "https://yourwebsite.com/webhook"
                  face_name: "AI"
                  train_video_url: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-train-video.mp4"
              Older Model Face:
                value:
                  model_name: "phoenix-3"
                  callback_url: "https://yourwebsite.com/webhook"
                  face_name: "My phoenix-3 Face"
                  train_video_url: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-train-video.mp4"
              Image to Face:
                value:
                  callback_url: "https://yourwebsite.com/webhook"
                  face_name: "Image Face"
                  train_image_url: "https://my-example-bucket.s3.us-east-1.amazonaws.com/your-train-image.png"
                  voice_name: "anna"
                  auto_fix_training_image: true

      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  face_id:
                    type: string
                    example: "r90bbd427f71"
                    description: "A unique identifier for the face."
                  status:
                    type: string
                    example: "started"
                    description: "The status of the face. Possible values: `started`, `completed`, `error`."
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "The error message."
                    example: "Either train_video_url or train_image_url must be provided."
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
      security:
        - apiKey: []
