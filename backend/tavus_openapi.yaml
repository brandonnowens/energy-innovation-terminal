        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
      security:
        - apiKey: []

    post:
      tags:
        - Voices
      summary: Create Voice
      description: |
        Creates a voice from a sample of audio and returns immediately with `status: "started"`.

        **A new voice can take up to a few minutes to be ready.** Cloning runs after this call returns, so the voice cannot speak yet and a conversation that references it will not resolve a voice. Wait for `status` to reach `completed`, in one of two ways:

        - **Pass `callback_url`** and Tavus posts an `application.voice_status_changed` event once the status settles, carrying `voice_id`, `voice_name`, and `status`. On `error` it also carries `error_message`. The payload is a state snapshot, so a duplicate delivery is safe to apply twice.
        - **Poll [Get Voice](/api-reference/voices/get-voice)** if you would rather not receive a webhook.

        `completed` means the voice can speak. It stays `completed` while Tavus continues preparing the remaining languages, so you do not need to wait for those.

        Once ready, use the `voice_id` as `layers.tts.voice_id` on a PAL, or as a face's `default_voice_id`.

        Most teams create and audition voices in [PAL Maker](https://maker.tavus.io/dev/voices/create), where you can hear the result before shipping it. See [Voices](/sections/conversational-video-interface/voices).

        You must hold the rights to the voice in your training audio.
      operationId: createVoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - voice_name
                - training_audio_url
              properties:
                voice_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: "A name for the voice."
                  example: "Ana"
                training_audio_url:
                  type: string
                  maxLength: 2048
                  description: "Publicly accessible link to the training audio. Accepts `.mp3`, `.wav`, `.m4a`, `.flac`, `.ogg`, `.oga`, `.webm`, `.mp4`, `.mov`, a video file is fine, the audio track is what is used."
                  example: "https://example.com/ana.mp3"
                description:
                  type: string
                  maxLength: 1000
                  description: "Free-text note about the voice, returned on reads."
                  example: "Warm, unhurried, mid-Atlantic"
                callback_url:
                  type: string
                  maxLength: 2048
                  description: "URL to receive the `application.voice_status_changed` webhook when the voice reaches `completed` or `error`."
                  example: "https://example.com/webhooks/voices"
                tags:
                  type: array
                  description: "Up to 50 tags, 64 characters each. Filter on them with the `tag` query parameter on List Voices."
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 64
                  example: ["support", "en"]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          description: "BAD REQUEST"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Voice creation requires a user-scoped API key"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"
        "429":
          description: "TOO MANY REQUESTS"
      security:
        - apiKey: []

  /v2/voices/{voice_id}:
    get:
      tags:
        - Voices
      summary: Get Voice
      description: "Returns a single voice and its current status."
      operationId: getVoice
      parameters:
        - name: voice_id
          in: path
          required: true
          description: "The voice identifier, e.g. `v0a1b2c3d4e5f`."
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "401":
          description: "UNAUTHORIZED"
        "404":
          description: "NOT FOUND"
      security:
        - apiKey: []
    patch:
      tags:
        - Voices
      summary: Update Voice
      description: "Renames, re-describes, or re-tags a voice. Send at least one field. `description: null` clears it; `voice_name` and `tags` have no meaningful empty state, so null is rejected for those."
      operationId: updateVoice
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                voice_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "Ana v2"
                description:
                  type: string
                  nullable: true
                  maxLength: 1000
                  example: "Warm, unhurried"
                tags:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 64
                  example: ["support"]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          description: "BAD REQUEST"
        "401":
          description: "UNAUTHORIZED"
        "404":
          description: "NOT FOUND"
      security:
        - apiKey: []
    delete:
      tags:
        - Voices
      summary: Delete Voice
      description: |
        Deletes a voice.

        A voice still referenced by a PAL or a face is **not** deleted: the request returns `409` with a `used_by` count of each, so you can repoint them and retry. A face's `original_voice_id` cannot be deleted at all, since it is the id a face reverts to.
      operationId: deleteVoice
      parameters:
        - name: voice_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "NO CONTENT"
        "401":
          description: "UNAUTHORIZED"
        "404":
          description: "NOT FOUND"
        "409":
          description: "CONFLICT: the voice is still in use, or is a face's original voice."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This voice is still in use by a face or pal"
                  used_by:
                    type: object
                    description: "How many faces and pals still point at this voice."
                    properties:
                      faces:
                        type: integer
                        example: 1
                      pals:
                        type: integer
                        example: 0
      security:
        - apiKey: []

  /v2/conversations:
    post:
      tags:
        - Conversations
      description: |
        This endpoint starts a real-time video conversation with your AI face, powered by a PAL that allows it to see, hear, and respond like a human.
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                face_id:
                  type: string
                  description: "The unique identifier for the face the PAL will render in the conversation. **Each request must have a valid `face_id` value that's either directly passed in or as part of a PAL**."
                  example: "r90bbd427f71"
                pal_id:
                  type: string
                  description: |
                    The unique identifier for the PAL that will use the specified face in the conversation.
                    
                    - **If your PAL does not have a valid `face_id`, you must define the `face_id` field.**
                    - **If your PAL already has a valid `face_id` and you provide one in the request, the `face_id` provided in the request will be used instead of the one defined in your PAL**.
                  example: "pcb7a34da5fe"
                audio_only:
                  type: boolean
                  description: "Specifies whether the interaction should be voice-only. **This field is required if you want to create an audio-only conversation**."
                  example: "false"
                callback_url:
                  type: string
                  description: "A url that will receive webhooks with updates regarding the conversation state."
                  example: "https://yourwebsite.com/webhook"
                conversation_name:
                  type: string
                  description: "A name for the conversation."
                  example: "Improve Sales Technique"
                conversational_context:
                  type: string
                  description: "Optional context that will be appended to any context provided in the PAL, if one is provided."
                  example: "I want to improve my sales techniques. Help me practice handling common objections from clients and closing deals more effectively."
                custom_greeting:
                  type: string
                  description: "An optional custom greeting that the PAL will give once a participant joines the conversation."
                  example: "Hey there!"
                memory_stores:
                  type: array
                  items:
                    type: string
                  description: "The memory stores to use for the conversation. The PAL will have access to the existing memories in the store and will add newly made memories to the store as well. In most use cases, you will only need to pass in a single memory store."
                  example: ["anna"]
                document_ids:
                  type: array
                  items:
                    type: string
                  description: "The ids of the documents that the PAL will be able to access during the conversation. The `document_ids` are returned during the document creation process in the response of the [Get Document](/api-reference/documents/get-document) and the [Create Document](/api-reference/documents/create-document) endpoints."
                  example: ["doc_1234567890"]
                document_retrieval_strategy:
                  type: string
                  description: "The strategy to use for document retrieval. Possible values: `speed`, `quality`, `balanced`. Default is `balanced`."
                  example: "balanced"
                document_tags:
                  type: array
                  items:
                    type: string
                  description: "The tags of the documents that the PAL will be able to access during the conversation. The tags are passed in the `document_tags` parameter of the [Create Document](/api-reference/documents/create-document) endpoint. The document tags do not have to be created explicitly, it is enough to pass in the tags during the document creation process."
                  example: ["sales", "marketing"]
                test_mode:
                  type: boolean
                  description: "If true, the conversation will be created but the PAL will not join the call. This can be used for testing the conversation creation process without incurring any costs. Additionally, the conversation will be created with a status `ended` so it does not affect concurrency limits."
                  example: false
                meeting_url:
                  type: string
                  description: |
                    A Google Meet URL for the PAL to join instead of a Tavus-hosted Daily room (for example `https://meet.google.com/abc-defg-hij`).

                    When set, the PAL joins that meeting shortly after the conversation is created. Requires the PAL to have a conferencing layer with `username` configured. See [Google Meet](/sections/conversational-video-interface/pal/meetings#join-a-google-meet-via-api).
                  example: "https://meet.google.com/xgq-epxn-ccp"
                require_auth:
                  type: boolean
                  description: "If true, creates a private room requiring authentication. A `meeting_token` will be returned in the response that must be used to join the conversation. Without a valid token, users will see 'You are not allowed to join this meeting.'"
                  example: false
                max_participants:
                  type: integer
                  minimum: 2
                  description: "Maximum number of participants allowed in the conversation room. Must be at least 2 (the PAL counts as one participant)."
                  example: 2
                policy:
                  type: string
                  description: |
                    Regional policy applied to this conversation. Set to `eu` when you want PAL fields left on `auto` to resolve as described in the [EU AI Act](/sections/onboarding-guide/eu-ai-act) product guide:

                    - `emotion_recognition: auto` behaves like `limited` (Raven-1 does not attach biometric-derived emotion).
                    - `disclosure_type: auto` delivers the spoken and on-screen AI disclosure for that conversation.
                    - Explicit settings (`full`, `limited`, `always`, `off`) are honored as-is and are not overridden by `policy`.

                    Leave unset when you do not want that auto resolution. Choosing the correct value per participant is your responsibility — on the create-conversation API Tavus does not geolocate the caller.
                  enum:
                    - "eu"
                  example: "eu"
                properties:
                  type: object
                  description: "Optional properties that can be used to customize the conversation."
                  properties:
                    max_call_duration:
                      type: integer
                      description: "The maximum duration of the call in seconds. The default max_call_duration is 3600 seconds (1 hour). Once the time limit specified by this parameter has been reached, the conversation will automatically shut down."
                      example: 3600
                    participant_left_timeout:
                      type: integer
                      description: "The duration in seconds after which the call will be automatically shut down once the last participant leaves."
                      example: 60
                    participant_absent_timeout:
                      type: integer
                      description: "Starting from conversation creation, the duration in seconds after which the call will be automatically shut down if no participant joins the call. Default is 300 seconds (5 minutes)."
                      example: 300
                    enable_recording:
                      type: boolean
                      description: "If true, the user will be able to record the conversation. You can find more instructions on recording [here](/sections/conversational-video-interface/quickstart/conversation-recordings#conversation-recordings)."
                      example: true
                    auto_start_recording:
                      type: boolean
                      description: "If true, Tavus starts the recording about a second after the pal joins, so you do not need to call `startRecording()` from your client. Requires `recording_storage`. Only supported on Tavus-hosted rooms - not with `daily_room`, `meeting_url`, or LiveKit. Defaults to false. See [Start recording automatically](/sections/conversational-video-interface/quickstart/conversation-recordings#start-recording-automatically)."
                      example: true
                    enable_closed_captions:
                      type: boolean
                      description: "If true, the user will be able to display closed captions (subtitles) during the conversation. You can find more instructions on displaying closed captions if you are using your custom DailyJS components [here](https://docs.daily.co/reference/daily-js/events/transcription-events#transcription-message). You need to have an [event listener](https://docs.daily.co/reference/daily-js/events) on Daily that listens for app-messages."
                      example: true
                    apply_greenscreen:
                      type: boolean
                      description: "If true, the background will be replaced with a greenscreen (RGB values: [0, 255, 155]). You can use WebGL on the frontend to make the greenscreen transparent or change its color."
                      example: true
                    language:
                      type: string
                      deprecated: true
                      description: |
                        **Deprecated.** Use `languages` instead, on this object or on the PAL.

                        `language` takes one FULL language name, not a code, or `multilingual` for automatic detection. It cannot express which languages a conversation should be prepared for, so it cannot restrict recognition, hold the PAL's replies to a set, or select a per-language voice. `languages` does all three, and covers the single-language case: `languages: ["es"]` is equivalent to `language: "spanish"`.

                        Existing integrations keep working unchanged. Where both are sent, `languages` wins and rewrites this field. See [Language support](/sections/conversational-video-interface/language-support).
                      example: "multilingual"
                    languages:
                      type: array
                      description: |
                        The languages this conversation is expected to run in, from the [spoken languages](/sections/conversational-video-interface/language-support#spoken-languages) Tavus supports. More precise than `language: multilingual`, Tavus restricts speech recognition to this set and holds the PAL's replies to it, instead of detecting from every language.

                        Setting `languages` decides `language` for you: several entries make the conversation `multilingual`, a single entry makes it that language. The first entry is the language the conversation opens in.

                        Overrides a `languages` set on the PAL; the two are not merged. A language the conversation cannot actually be held in, one the resolved TTS engine and model cannot speak, is rejected rather than ignored. See [Language support](/sections/conversational-video-interface/language-support#setting-languages).
                      maxItems: 42
                      items:
                        type: string
                        maxLength: 16
                      example: ["en", "es", "pt"]
                    recording_s3_bucket_name:
                      type: string
                      deprecated: true
                      description: |
                        **Deprecated.** Use `recording_storage` (also on `properties`) instead. The name of the S3 bucket where the recording will be stored. Existing integrations using this flat field continue to work unchanged.
                      example: "conversation-recordings"
                    recording_s3_bucket_region:
                      type: string
                      deprecated: true
                      description: |
                        **Deprecated.** Use `recording_storage` (also on `properties`) instead. The region of the S3 bucket where the recording will be stored. Existing integrations using this flat field continue to work unchanged.
                      example: "us-east-1"
                    aws_assume_role_arn:
                      type: string
                      deprecated: true
                      description: |
                        **Deprecated.** Use `recording_storage` (also on `properties`) instead. The ARN of the role that will be assumed to access the S3 bucket. Existing integrations using this flat field continue to work unchanged.
                      example: ""
                    recording_storage:
                      $ref: "#/components/schemas/recording_storage_config"
            examples:
              Required Parameters Only:
                 value:
                   face_id: "r90bbd427f71"
                   pal_id: "pcb7a34da5fe"
              Full Customizations:
                value:
                  face_id: "r90bbd427f71"
                  pal_id: "pcb7a34da5fe"
                  callback_url: "https://yourwebsite.com/webhook"
                  conversation_name: "Improve Sales Technique"
                  conversational_context: "I want to improve my sales techniques. Help me practice handling common objections from clients and closing deals more effectively."
                  properties:
                    max_call_duration: 1800
                    participant_left_timeout: 60
                    participant_absent_timeout: 120
                    language: "multilingual"
                    enable_closed_captions: true
                    apply_greenscreen: true
              Audio Only:
                 value:
                   face_id: "r90bbd427f71"
                   pal_id: "pcb7a34da5fe"
                   audio_only: true
              Private Room:
                 value:
                   face_id: "r90bbd427f71"
                   pal_id: "pcb7a34da5fe"
                   require_auth: true
              Google Meet (direct invite):
                value:
                  face_id: "r90bbd427f71"
                  pal_id: "pcb7a34da5fe"
                  meeting_url: "https://meet.google.com/xgq-epxn-ccp"
              EU AI Act compliance (policy = eu):
                value:
                  face_id: "r90bbd427f71"
                  pal_id: "pcb7a34da5fe"
                  policy: "eu"
              Recording Storage - Amazon S3:
                value:
                  face_id: "rf4e9d9790f0"
                  pal_id: "pcb7a34da5fe"
                  properties:
                    enable_recording: true
                    recording_storage:
                      provider: "s3"
                      bucket_name: "conversation-recordings"
                      bucket_region: "us-east-1"
                      assume_role_arn: "arn:aws:iam::123456789012:role/TavusRecordingWriter"
                      external_id: "tavus-acct-abc123"
              Recording Storage - Google Cloud Storage:
                value:
                  face_id: "rf4e9d9790f0"
                  pal_id: "pcb7a34da5fe"
                  properties:
                    enable_recording: true
                    recording_storage:
                      provider: "gcs"
                      bucket_name: "conversation-recordings"
                      project_id: "my-gcp-project"
                      workload_identity_provider: "projects/123456/locations/global/workloadIdentityPools/tavus-recording-pool/providers/tavus-worker"
                      service_account_email: "tavus-recording-writer@my-gcp-project.iam.gserviceaccount.com"
              Recording Storage - Azure Blob Storage:
                value:
                  face_id: "rf4e9d9790f0"
                  pal_id: "pcb7a34da5fe"
                  properties:
                    enable_recording: true
                    recording_storage:
                      provider: "azure_blob"
                      storage_account: "myrecordingsaccount"
                      container: "conversation-recordings"
                      tenant_id: "11111111-2222-3333-4444-555555555555"
                      client_id: "66666666-7777-8888-9999-000000000000"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    description: "A unique identifier for the conversation."
                    example: "c123456"
                  conversation_name:
                    type: string
                    description: "The name of the conversation."
                    example: "A Meeting with Hassaan"
                  conversation_url:
                    type: string
                    description: "A direct link to join the conversation. This link can be used to join the conversation directly or can be embedded in a website."
                    example: "https://tavus.daily.co/c123456"
                  status:
                    type: string
                    description: "The status of the conversation. Possible values: `active`, `ended`."
                    example: "active"
                  callback_url:
                    type: string
                    description: "The url that will receive webhooks with updates of the conversation state."
                    example: "sample.com/callback"
                  created_at:
                    type: string
                    description: "The date and time the conversation was created."
                    example: "<string>"
                  meeting_token:
                    type: string
                    description: "A short-lived JWT token required to join the conversation. Only returned when `require_auth` is true. Append as `?t=TOKEN` to the conversation URL or pass to Daily SDK's join() method."
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: "Bad Request. The response body contains either an `error` or `message` field depending on the error type."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "Present for request validation errors."
                  message:
                    type: string
                    description: "Present for limit and account errors."
              examples:
                bad_request:
                  summary: "Missing required field"
                  value:
                    error: "Bad Request. {'_schema': ['Either face_id or a pal_id with a default face specified must be present.']}"
                concurrent_limit:
                  summary: "Concurrent conversation limit reached"
                  value:
                    message: "User has reached maximum concurrent conversations"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
    get:
      tags:
        - Conversations
      summary: List Conversations
      description: |
        This endpoint returns a list of all Conversations created by the account associated with the API Key in use.
      operationId: listConversations
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: "The number of conversations to return per page. Default is 10."
        - in: query
          name: page
          schema:
            type: integer
          description: "The page number to return. Default is 1."
        - in: query
          name: status
          schema:
            type: string
          description: "Filter the conversations by status. Possible values: active, ended."
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: "Conversations for the current page; use `total_count` for the full count under the applied filters."
                    items:
                      type: object
                      properties:
                        conversation_id:
                          type: string
                          description: "A unique identifier for the conversation."
                          example: "c123456"
                        conversation_name:
                          type: string
                          description: "A name for the conversation."
                          example: "A Meeting with Hassaan"
                        status:
                          type: string
                          description: "The status of the video."
                          example: "active"
                        conversation_url:
                          type: string
                          description: "A direct link to join the conversation."
                          example: "https://tavus.daily.co/c123456"
                        callback_url:
                          type: string
                          description: "The url that will receive webhooks with updates of the conversation state."
                          example: "https://yourwebsite.com/webhook"
                        face_id:
                          type: string
                          description: "A unique identifier for the face used to create this conversation"
                          example: "r90bbd427f71"
                        pal_id:
                          type: string
                          description: "A unique identifier for the PAL used to create this conversation"
                          example: "pcb7a34da5fe"
                        created_at:
                          type: string
                          description: "The date and time the conversation was created."
                          example: ""
                        updated_at:
                          type: string
                          description: "The date and time of when the conversation was last updated."
                  total_count:
                    type: integer
                    description: "The total number of conversations given the filters provided."
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: "The error message."
                    example: "Invalid access token"
      security:
        - apiKey: []

  /v2/conversations/{conversation_id}:
    get:
      tags:
        - Conversations
      summary: Get Conversation
      description: |
        This endpoint returns a single conversation by its unique identifier.
      operationId: getConversation
      parameters:
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Append `verbose=true` to the URL to receive additional event data in the response, including:
            - `shutdown_reason`: The reason why the conversation ended (e.g., "participant_left_timeout")
            - `system.pal_joined`: When the PAL joined the conversation (preferred for new integrations)
            - `system.replica_joined`: **Legacy duplicate** of `system.pal_joined` with an identical payload; still sent for backward compatibility
            - `system.shutdown`: When and why the conversation ended
            - `application.transcription_ready`: The end-of-call transcript. Each entry in `properties.transcript` has `role` (`user` / `assistant` / `system` / `tool`), `content`, `timestamp` (Unix epoch float, seconds), `seconds_from_start`, `duration` (seconds, float) and `inference_id` where available.
            - `application.perception_analysis`: The final visual analysis of the user that includes their appearance, behavior, emotional states, and screen activities
            - `application.perception_unavailable`: Emitted when perception is enabled but no visual analysis could be produced. `properties.reason` is one of `no_vision_history`, `empty_summary`, or `summary_error` (for example, the participant's camera was off, no frames were received, or the summary came back empty).
            - `application.post_call_action_executed`: The outcome of each [post-call action](/sections/conversational-video-interface/pal/post-call-tool) Tavus ran after the call, with `tool_name`, `status`, and the action's `request` / `response`.

            This is particularly useful as an alternative to using the `callback_url` parameter on the [create conversation](/api-reference/conversations/create-conversation) endpoint for retrieving detailed conversation data.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    example: "c123456"
                    description: "A unique identifier for the conversation."
                  conversation_name:
                    type: string
                    example: "A Meeting with Hassaan"
                    description: "The name of the conversation."
                  conversation_url:
                    type: string
                    example: "https://tavus.daily.co/c123456"
                    description: "A direct link to join the conversation."
                  callback_url:
                    type: string
                    description: "The url that will receive webhooks with updates of the conversation state."
                    example: "https://yourwebsite.com/webhook"
                  status:
                    type: string
                    description: "The status of the conversation."
                    example: "active"
                  face_id:
                    type: string
                    description: "A unique identifier for the face used to create this conversation"
                    example: "r90bbd427f71"
                  pal_id:
                    type: string
                    description: "A unique identifier for the PAL used to create this conversation"
                    example: "pcb7a34da5fe"
                  policy:
                    type: string
                    nullable: true
                    description: "Regional policy the conversation was created with (see [EU AI Act](/sections/onboarding-guide/eu-ai-act)). Currently `eu` or unset."
                    example: "eu"
                  created_at:
                    type: string
                    example: ""
                    description: "The date and time the conversation was created."
                  updated_at:
                    type: string
                    example: ""
                    description: "The date and time of when the conversation was last updated."
                  events:
                    type: array
                    nullable: true
                    description: "When `verbose=true`, additional conversation events (e.g. shutdown, perception analysis payloads, end-of-call transcript)."
                    items:
                      type: object
                      properties:
                        event_type:
                          type: string
                          description: "Event name (e.g. system.pal_joined, system.replica_joined, application.transcription_ready, application.perception_analysis, application.perception_unavailable, application.post_call_action_executed)."
                        timestamp:
                          type: string
                          description: "ISO 8601 time of the event."
                        properties:
                          type: object
                          additionalProperties: true
                          description: "Event-specific payload when present. For `application.transcription_ready`, includes a `transcript` array of per-turn entries."
              examples:
