  /v2/conversations/{conversation_id}/canvas/interactions:
    parameters:
      - name: conversation_id
        in: path
        required: true
        description: The unique identifier of the conversation.
        schema:
          type: string
          example: c123456
    post:
      tags:
        - Conversations
      summary: Record Canvas Interaction
      description: |
        Record a Magic Canvas interaction (submit, skip, dismiss, clear, error, or heartbeat) while a conversation is **active**.

        The Tavus-hosted embed and `@tavus/cvi-ui` post interactions for you. Call this endpoint directly only if you build your own renderer.

        **Authentication:** No API key is required while the conversation is active. Never put your Tavus API key in a browser. Once the conversation ends, every POST is rejected.

        **Idempotency:** Retries with the same `(conversation_id, interaction_id)` and identical `tool_call_id`, `component`, `component_version`, `type`, and `value` return `200` without firing a second webhook. `metadata` is excluded from the match.

        **Rate limiting:** 120 POSTs per 60-second window per `(client IP, conversation_id)`. Exceeding the limit returns `429` with `{ "error": "Too many requests" }` and a `Retry-After` header (seconds until the window resets). Custom renderers posting `heartbeat` interactions count toward this limit.

        See [Canvas interactions](/sections/conversational-video-interface/magic-canvas/api/interactions) for per-component `value` rules, webhook delivery, and the full error catalog.
      operationId: recordCanvasInteraction
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/canvasInteractionRequest"
            examples:
              question_submit:
                summary: Question submit
                value:
                  interaction_id: "ci_call_8f2d41_submit_5e0b7c2a"
                  tool_call_id: "call_8f2d41"
                  component: "canvas.question"
                  component_version: "v1"
                  type: "submit"
                  value:
                    selected_option_ids: ["opt_2"]
                    skipped: false
                  metadata:
                    client: "kiosk-web"
      responses:
        "200":
          description: "Interaction recorded (or idempotent replay)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: "Bad Request - invalid payload, unknown conversation, or conversation not active"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: "Schema validation failure on the public route (field names only)."
                    properties:
                      error:
                        type: string
                        example: "Invalid canvas interaction payload."
                      fields:
                        type: array
                        items:
                          type: string
                        example: ["component", "value"]
                  - type: object
                    description: "Business-rule rejection."
                    properties:
                      message:
                        type: string
                        example: "Canvas interactions can only be recorded for active conversations."
        "409":
          description: "Conflict - interaction does not match the issued canvas instance, or interaction_id reused with a different payload"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Interaction does not match the issued canvas instance for this tool_call_id."
        "429":
          description: "Too Many Requests - rate limit exceeded (120 POSTs per 60-second window per client IP and conversation)"
          headers:
            Retry-After:
              description: "Seconds until the current rate-limit window resets."
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Too many requests"
    get:
      tags:
        - Conversations
      summary: List Canvas Interactions
      description: |
        Returns every Canvas interaction recorded for a conversation, oldest first. Uses the same field shape as the `canvas.interaction` webhook's `properties` object.

        Readable during and after the conversation. Call from your backend with your API key - not from the browser.

        See [Canvas interactions](/sections/conversational-video-interface/magic-canvas/api/interactions).
      operationId: listCanvasInteractions
      security:
        - apiKey: []
      responses:
        "200":
          description: "Interaction history returned"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/canvasInteractionRecord"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid conversation_id"
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid access token"

