name: Deploy API container

# Manual. Merging to main deploys the Pages frontend only.
# Run this after Worker secrets exist, and before relying on the new API URL.
on:
  workflow_dispatch:
  # workflow_dispatch is not available to this agent token. A push that edits
  # this file deploys the API once. Other commits on main do not rebuild the image.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy energy-innovation-api Worker and container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workers/energy-innovation-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/energy-innovation-api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Show Docker
        working-directory: .
        run: docker version

      - name: Deploy Worker and container image
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.2"
          workingDirectory: workers/energy-innovation-api
          command: deploy
