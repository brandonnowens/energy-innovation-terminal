name: Deploy API container

# Manual. Merging to main deploys the Pages frontend only.
# Run this after Worker secrets exist, and before relying on the new API URL.
on:
  workflow_dispatch:
  # workflow_dispatch is not available to this agent token. A push that edits
  # this file deploys the API once. Other commits on main do not rebuild the image.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy energy-innovation-api Worker and container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workers/energy-innovation-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/energy-innovation-api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Show Docker
        working-directory: .
        run: docker version

      - name: Deploy Worker and container image
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.2"
          workingDirectory: workers/energy-innovation-api
          command: deploy

      - name: Sync Worker secrets from Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          GHOST_WEBHOOK_SECRET: ${{ secrets.GHOST_WEBHOOK_SECRET }}
          ADMIN_GMAIL_PASSWORD: ${{ secrets.ADMIN_GMAIL_PASSWORD }}
          TAVUS_API_KEY: ${{ secrets.TAVUS_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, stat
          required = "DATABASE_URL"
          optional = [
              "OPENAI_API_KEY",
              "ANTHROPIC_API_KEY",
              "GEMINI_API_KEY",
              "JWT_SECRET_KEY",
              "GHOST_ADMIN_API_KEY",
              "GHOST_WEBHOOK_SECRET",
              "ADMIN_GMAIL_PASSWORD",
              "TAVUS_API_KEY",
              "SOCRATA_APP_TOKEN",
              "GRANTS_GOV_API_KEY",
              "SAM_GOV_API_KEY",
          ]
          database_url = os.environ.get(required, "")
          if not database_url.strip():
              raise SystemExit("Actions secret DATABASE_URL is required.")
          payload = {required: database_url}
          for key in optional:
              value = os.environ.get(key, "")
              if value.strip():
                  payload[key] = value
          path = os.path.join(os.environ["RUNNER_TEMP"], "worker-secrets.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          print("Updating Worker secrets:", ", ".join(payload))
          PY
          npx wrangler secret bulk "${RUNNER_TEMP}/worker-secrets.json"
          rm -f "${RUNNER_TEMP}/worker-secrets.json"

      - name: Reload the Worker so the container restarts with those secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --containers-rollout=none --var "SECRETS_REFRESHED_AT:${{ github.run_id }}"
