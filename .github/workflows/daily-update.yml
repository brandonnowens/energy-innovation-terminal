name: Daily data update

# Replaces the Render cron energy-innovation-daily-sync
# (python -m app.jobs.cron_sync --source all at 06:00 UTC).
# This workflow runs the full daily routine: news, feed sync, digest,
# usage summary, and the data-quality audit.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      skip_ingestion:
        description: Skip external feed ingestion
        type: boolean
        default: false

concurrency:
  group: energy-innovation-daily-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily-update:
    name: Run daily automation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Repository secret DATABASE_URL is not set."
            echo "Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run daily automation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          ENABLE_BACKGROUND_SCHEDULERS: "false"
          SKIP_STARTUP_WARM: "true"
          ENVIRONMENT: production
          PYTHONPATH: backend
          PYTHONUNBUFFERED: "1"
        run: |
          args=()
          if [ "${{ inputs.skip_ingestion }}" = "true" ]; then
            args+=(--skip-ingestion)
          fi
          python -m app.cron.daily_routine "${args[@]}"

      - name: Upload usage and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-reports
          if-no-files-found: ignore
          path: |
            reports/daily_usage/
            backend/data/audit/
